name: Publish FoamLab with Hexo
on:
  push:
    branches: [main, foamlab-source]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: foamlab-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.ref_name == 'foamlab-source'
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        if: github.ref_name == 'foamlab-source'
        run: npm ci
      - name: Validate TeX and build with Hexo
        if: github.ref_name == 'foamlab-source'
        run: |
          node tools/check-tex.cjs
          node tools/check-rebuild.cjs
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.ref_name == 'foamlab-source' && './public-openfoam' || '.' }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
