title: OpenFOAM v2512 学习站
subtitle: FoamLab
description: 从第一个算例到电极气泡建模，面向初学者的 OpenFOAM v2512 中文学习网站。
author: MrLittleShark
language: zh-CN
timezone: Asia/Shanghai
url: https://mrlittleshark.github.io
root: /
