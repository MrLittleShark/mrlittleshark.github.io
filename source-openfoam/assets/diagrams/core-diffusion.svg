<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="一维稳态导热：线性解检验扩散离散"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1667ba"/></marker></defs><rect width="960" height="480" rx="18" fill="#f8fbff"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="40" y="49" font-size="26" fill="#14334e" text-anchor="start" font-weight="650">一维稳态导热：线性解检验扩散离散</text><polygon points="130,140 770,140 770,320 130,320" fill="#d9eafa" stroke="#1667ba" stroke-width="2"/><line x1="130" y1="340" x2="130" y2="115" stroke="#e56d5d" stroke-width="4"/><line x1="770" y1="340" x2="770" y2="115" stroke="#1667ba" stroke-width="4"/><line x1="132" y1="150" x2="768" y2="300" stroke="#1667ba" stroke-width="4"/><text x="130" y="376" font-size="22" fill="#14334e" text-anchor="middle" font-weight="400">T₀ = 400 K</text><text x="770" y="376" font-size="22" fill="#14334e" text-anchor="middle" font-weight="400">T₁ = 300 K</text><text x="440" y="240" font-size="23" fill="#14334e" text-anchor="middle" font-weight="400">T(x) = T₀ + (T₁ − T₀)x/L</text><text x="445" y="112" font-size="20" fill="#14334e" text-anchor="middle" font-weight="400">常导热系数、无体积热源、稳态</text><text x="40" y="451" font-size="15" fill="#62798c" text-anchor="start" font-weight="400">FoamLab · 原创教学示意图，非计算结果</text></g></svg>